services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_kpi_postgres
    environment:
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: kpi
      POSTGRES_DB: kpi_government
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi_government"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
