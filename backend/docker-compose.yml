services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_kpi_postgres
    environment:
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: kpi
      POSTGRES_DB: kpi_government
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi_government"]
      interval: 10s
      timeout: 5s
      retries: 5

  pdf-service:
    build:
      context: ../pdf-service
    container_name: ai_kpi_pdf_service
    environment:
      PORT: 4100
      PDF_SERVICE_API_KEY: ""
    ports:
      - "4100:4100"
    restart: unless-stopped

volumes:
  postgres_data: